<details class="tag-panel" {% if open | default(true) %}open{% endif %}>
  <summary class="tag-panel-summary">
    <span class="tag-panel-title">{{ panel_title | default(label) | default("Теги") }}</span>
  </summary>
  <div class="tag-checklist-wrap">
    <div class="tag-checklist">
      {% for tag in all_tags %}
      <label class="tag-check">
        <input
          type="checkbox"
          name="tags"
          value="{{ tag }}"
          {% if tag in selected_tags %}checked{% endif %}
          {% if form_id %}form="{{ form_id }}"{% endif %}
        >
        <span>{{ tag_label(tag) }}</span>
      </label>
      {% else %}
      <p class="field-hint">Тегов пока нет.</p>
      {% endfor %}
    </div>
  </div>
</details>
{% if hint %}
<p class="field-hint">{{ hint }}</p>
{% endif %}
